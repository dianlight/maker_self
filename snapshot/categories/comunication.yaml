    ''Ra-02'', ''Ai-Thinker'', ''SX1278 433MHz'', ''PA +1dBm'', ''LoRa / FSK / OOK'',
    ''410-525MHz''. Package SMD a moduli con pad castellati sui due lati: a sinistra
    GND, DIO4, DIO5, SCK, MISO, MOSI, NSS; a destra DIO3, DIO2, DIO1, DIO0, RST, 3.3V,
    GND, GND. Presenta connettore coassiale U.FL/IPEX con pigtail nero collegato.
    Componenti passivi SMD (condensatori e induttanze) visibili accanto al modulo
    RF. Nella foto e'' presente anche una striscia di antenna flessibile adesiva bianca
    con scritta stampata (marchio/tipo parzialmente leggibile)'
