name: datasheet-check

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      max_rows:
        description: "Max righe da controllare in questo run"
        required: false
        default: "25"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check datasheet (colonna H)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: inventario
          MAX_ROWS_PER_RUN: ${{ inputs.max_rows || '25' }}
        run: python scripts/check_datasheets.py
      - name: Trova datasheet mancanti via web search + LLM
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: inventario
          WEBSEARCH_PROVIDERS: ${{ secrets.WEBSEARCH_PROVIDERS }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
        run: python scripts/ai_find_datasheets.py
      - name: Commit report if changed
        run: |
          git config user.name "maker-self-bot"
          git config user.email "maker-self-bot@users.noreply.github.com"
          git add snapshot/datasheet-report.json
          git diff --cached --quiet || git commit -m "datasheet: report $(date -u +%F)"
          git push
